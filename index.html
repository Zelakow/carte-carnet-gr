<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carnet GR · Carte IGN</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root{--bg:#f4f5f1;--fg:#16201a;--mut:#5c6a61;--glass:rgba(255,255,255,.86);--edge:rgba(20,30,24,.14);--acc:#cf1734}
@media (prefers-color-scheme:dark){:root{--bg:#101512;--fg:#eef2ee;--mut:#a3b0a7;--glass:rgba(24,30,26,.86);--edge:rgba(255,255,255,.16)}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#map{position:fixed;inset:0}
.bar{position:fixed;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none;z-index:5}
.pill{pointer-events:auto;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--edge);border-radius:999px;padding:8px 14px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.title{font-weight:650;max-width:min(60vw,420px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title small{font-weight:400;color:var(--mut);margin-left:6px}
.seg{display:flex;padding:3px;gap:2px}
.seg button,.btn{font:inherit;color:inherit;border:0;background:none;border-radius:999px;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
@media (max-width:760px){#exg{top:calc(max(10px,env(safe-area-inset-top)) + 104px)!important}}  
.exw{position:relative;width:min(46vw,220px);padding-bottom:14px}
#exr{width:100%;margin:0;accent-color:var(--fg);touch-action:none;height:26px}
.exticks{position:absolute;left:0;right:0;bottom:0;height:12px;font-size:10px;color:var(--mut)}
.exticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.exticks span::before{content:"";position:absolute;left:50%;top:-5px;width:1px;height:4px;background:currentColor}
.side{position:fixed;right:max(10px,env(safe-area-inset-right));bottom:calc(max(10px,env(safe-area-inset-bottom)) + 34px);display:flex;flex-direction:column;gap:8px;z-index:5}
.side .btn[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.side .btn{width:44px;height:44px;padding:0;font-size:20px;line-height:1;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--edge);box-shadow:0 2px 10px rgba(0,0,0,.12)}
#msg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(14px,env(safe-area-inset-bottom)) + 40px);z-index:6;max-width:min(90vw,460px);text-align:center}
#msg[hidden]{display:none}
[hidden]{display:none!important}
.maplibregl-ctrl-attrib{font-size:11px}

.side{flex-wrap:wrap-reverse;max-height:calc(100vh - 150px);justify-content:flex-start;align-content:flex-end;gap:8px}
#prof{position:fixed;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));z-index:4;padding:8px 12px 6px;border-radius:18px;display:none}
#prof.on{display:block}
#prof .ph{display:flex;gap:12px;flex-wrap:wrap;align-items:baseline;font-size:13px;color:var(--mut)}#prof .ph b{color:var(--fg)}
#prof svg{width:100%;height:96px;display:block;touch-action:none;cursor:crosshair}
#prof .tip{position:absolute;top:2px;right:12px;font-size:13px;font-weight:650}
#live{position:fixed;left:50%;transform:translateX(-50%);top:calc(max(10px,env(safe-area-inset-top)) + 54px);z-index:6;max-width:min(92vw,520px);text-align:center;font-weight:650;display:none}
#live.on{display:block}#live.warn{background:#cf1734;color:#fff}
#lay{position:fixed;right:calc(max(10px,env(safe-area-inset-right)) + 56px);bottom:calc(max(10px,env(safe-area-inset-bottom)) + 34px);z-index:6;padding:10px 14px;border-radius:16px;display:none;font-size:14px}
#lay.on{display:block}#lay label{display:flex;gap:8px;align-items:center;padding:5px 0;white-space:nowrap}#lay small{display:block;color:var(--mut);font-size:12px;margin-top:4px}
body.hasprof .side{bottom:calc(max(10px,env(safe-area-inset-bottom)) + 160px)}body.hasprof #msg{bottom:calc(max(14px,env(safe-area-inset-bottom)) + 170px)}body.hasprof #lay{bottom:calc(max(10px,env(safe-area-inset-bottom)) + 160px)}
</style>
</head>
<body>
<div id="map"></div>
<div class="bar">
  <div class="pill title" id="title">Carte IGN</div>
  <div class="pill seg" role="group" aria-label="Fond de carte">
    <button data-b="plan" aria-pressed="true">Plan IGN</button>
    <button data-b="topo" aria-pressed="false">Classique</button>
    <button data-b="photo" aria-pressed="false">Photos</button>
  </div>
</div>
<div class="side">
  <button class="btn pill" id="d3" title="Relief en 3D" aria-label="Relief en 3D" aria-pressed="false" style="font-size:14px;font-weight:700">3D</button>
  <button class="btn pill" id="prb" title="Profil d'altitude" aria-label="Profil d'altitude" aria-pressed="false" style="font-size:13px;font-weight:700">⛰</button>
  <button class="btn pill" id="fly3" title="Survol du parcours en relief (3D)" aria-label="Survol en relief 3D" aria-pressed="false" style="font-size:13px;font-weight:700">▶3D</button>
  <button class="btn pill" id="fly2" title="Survol du parcours vu du dessus (2D)" aria-label="Survol vu du dessus 2D" aria-pressed="false" style="font-size:13px;font-weight:700">▶2D</button>
  <button class="btn pill" id="allb" title="Tous les sentiers" aria-label="Tous les sentiers" aria-pressed="false" style="font-size:15px">🥾</button>
  <button class="btn pill" id="lyb" title="Couches" aria-label="Couches" aria-pressed="false">☰</button>
  <button class="btn pill" id="off" title="Garder la zone hors-ligne" aria-label="Garder la zone hors-ligne">⬇︎</button>
  <button class="btn pill" id="fit" title="Voir tout le parcours" aria-label="Voir tout le parcours">⤢</button>
  <button class="btn pill" id="loc" title="Ma position" aria-label="Ma position">◎</button>
  <button class="btn pill" id="gpx" title="Télécharger le GPX" aria-label="Télécharger le GPX">⇩</button>
</div>
<div class="pill seg" id="saison" hidden role="group" aria-label="Saison" style="position:fixed;left:50%;transform:translateX(-50%);top:calc(max(10px,env(safe-area-inset-top)) + 46px);z-index:5"><button data-s="ete" aria-pressed="true">Chemins d'été</button><button data-s="hiver" aria-pressed="false">Chemins d'hiver</button></div>
<div class="pill" id="msg" hidden></div>
<div class="pill" id="live"></div>
<div class="pill seg" id="spd" hidden role="group" aria-label="Vitesse du survol" style="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(10px,env(safe-area-inset-bottom)) + 34px);z-index:6"><span style="padding:6px 8px;color:var(--mut)">Vitesse</span><button data-s="0.5">×½</button><button data-s="1" aria-pressed="true">×1</button><button data-s="2">×2</button><button data-s="4">×4</button></div>
<div class="pill" id="exg" hidden role="group" aria-label="Relief" style="position:fixed;left:max(10px,env(safe-area-inset-left));top:calc(max(10px,env(safe-area-inset-top)) + 56px);z-index:5;display:flex;align-items:center;gap:10px;padding:6px 14px"><span style="color:var(--mut)">Relief</span><div class="exw"><input type="range" id="exr" min="1" max="5" step="0.01" aria-label="Exagération du relief"><div class="exticks" aria-hidden="true"></div></div><b id="exv" style="min-width:3.2em;text-align:right">×2</b></div>
<div class="pill" id="lay"><label><input type="checkbox" id="l-slope"> Pentes de montagne (&gt; 30° = avalanche)</label><label><input type="checkbox" id="l-trail"> Sentiers balisés (Waymarked Trails)</label><label><input type="checkbox" id="l-hill"> Ombrage du relief</label><small>Pentes : IGN · sentiers : waymarkedtrails.org, © OpenStreetMap</small></div>
<div class="pill" id="prof"><div class="ph" id="prof-h"></div><div class="tip" id="prof-t"></div><svg id="prof-s" viewBox="0 0 600 96" preserveAspectRatio="none"></svg></div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
<script>
/* Carnet GR — carte IGN complète. Le parcours arrive dans l'adresse (après #) : rien n'est enregistré ni envoyé ailleurs qu'à l'IGN (fonds de carte).
   #n=<nom>&t=<polyline précision 5>&m=<lat,lng,étiquette;…> */
const P = new URLSearchParams(location.hash.slice(1));
const HP=location.hash.slice(1).split("&"),WANT3D=HP.includes("3d"),EUROPE=HP.includes("europe");
function decode(s){const o=[];let i=0,la=0,lo=0;while(i<s.length){for(const k of [0,1]){let r=0,sh=0,b;do{b=s.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5}while(b>=32&&i<=s.length);const d=r&1?~(r>>1):r>>1;if(k)lo+=d;else la+=d}o.push([lo/1e5,la/1e5])}return o}
let track=[];try{track=decode(P.get("t")||"").filter(p=>isFinite(p[0])&&isFinite(p[1])&&Math.abs(p[1])<=90)}catch{}
const guide=track.slice();let precise=null,eles=null; // guide = tracé simplifié de l'appli ; precise = tracé calé (lon,lat)
const osmId=(/^\d+/.exec(P.get("g")||"")||[""])[0];
const marks=(P.get("m")||"").split(";").map(s=>s.split(",")).filter(a=>a.length>=2&&isFinite(+a[0])&&isFinite(+a[1])).map(a=>({lat:+a[0],lng:+a[1],l:(a.slice(2).join(",")||"").slice(0,60)}));
const name=(P.get("n")||"").slice(0,90);
let apPaths=[];try{apPaths=(P.get("a")||"").split(";").filter(Boolean).map(x=>decode(x).filter(p=>isFinite(p[0])&&isFinite(p[1]))).filter(l=>l.length>1)}catch{} // chemins réels gare ↔ sentier (envoyés par l'appli)
const hav=(a,b)=>{const r=x=>x*Math.PI/180;const h=Math.sin(r(b[1]-a[1])/2)**2+Math.cos(r(a[1]))*Math.cos(r(b[1]))*Math.sin(r(b[0]-a[0])/2)**2;return 12742*Math.asin(Math.sqrt(Math.min(1,h)))}; // km, points [lon,lat]
const lenKm=L=>{let d=0;for(let i=1;i<L.length;i++)d+=hav(L[i-1],L[i]);return d};
const T=document.getElementById("title");
function setTitle(){T.textContent=name||"Carte IGN";if(track.length>1){const s=document.createElement("small");s.textContent=(lenKm(track)<20?lenKm(track).toFixed(1).replace(".",","):Math.round(lenKm(track)))+" km";T.appendChild(s)}}
setTitle();
document.title=(name?name+" · ":"")+"Carte IGN";
const msg=(t,ms)=>{const m=document.getElementById("msg");m.textContent=t;m.hidden=!t;clearTimeout(msg.t);if(t&&ms!==0)msg.t=setTimeout(()=>m.hidden=true,ms||5000)};

const ATTR='© <a href="https://www.ign.fr" target="_blank" rel="noopener">IGN</a> – Géoplateforme';
const wmts=(layer,fmt)=>"https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER="+layer+"&STYLE=normal&FORMAT="+fmt+"&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}";
const raster=(layer,fmt,maxzoom)=>({version:8,glyphs:"https://data.geopf.fr/annexes/ressources/vectorTiles/fonts/{fontstack}/{range}.pbf",sources:{r:{type:"raster",tiles:[wmts(layer,fmt)],tileSize:256,maxzoom,attribution:ATTR}},layers:[{id:"r",type:"raster",source:"r"}]});
const BASES={plan:"https://data.geopf.fr/annexes/ressources/vectorTiles/styles/PLAN.IGN/standard.json",topo:raster("GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2","image/png",18),photo:raster("ORTHOIMAGERY.ORTHOPHOTOS","image/jpeg",19)};
let base="plan";try{const b=localStorage.getItem("cgr-fond");if(BASES[b])base=b}catch{}

const bounds=track.length>1?track.reduce((b,p)=>[[Math.min(b[0][0],p[0]),Math.min(b[0][1],p[1])],[Math.max(b[1][0],p[0]),Math.max(b[1][1],p[1])]],[[180,90],[-180,-90]]):null;
const map=new maplibregl.Map({container:"map",style:BASES[base],bounds:bounds||(EUROPE?[[-9.5,36.5],[19.5,55]]:[[-5.2,41.3],[9.6,51.1]]),fitBoundsOptions:{padding:{top:80,bottom:50,left:40,right:60}},maxZoom:19,attributionControl:{compact:false},dragRotate:false,pitchWithRotate:true,maxPitch:75});
map.touchZoomRotate.disableRotation();
map.addControl(new maplibregl.ScaleControl({unit:"metric"}),"bottom-left");
let relief=false;try{relief=localStorage.getItem("cgr-3d")==="1"}catch{}
if(WANT3D)relief=true; /* lien « Carte de tous les sentiers » de l'appli : #tous&europe&3d */
let exag=2;try{const e=+localStorage.getItem("cgr-exag");if(e>=1&&e<=5)exag=e}catch{}
const DEM={type:"raster-dem",tiles:["https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"],encoding:"terrarium",tileSize:256,maxzoom:14,attribution:"Relief © Mapzen / AWS Terrain Tiles"};
function applyRelief(){ // relief réel (MNT mondial) : le fond de carte et le tracé épousent le terrain ; inclinaison et rotation seulement en 3D
  if(!map.getSource("dem"))map.addSource("dem",DEM);
  if(!map.getLayer("hill"))map.addLayer({id:"hill",type:"hillshade",source:"dem",paint:{"hillshade-exaggeration":.35,"hillshade-shadow-color":"#3a4a3f","hillshade-highlight-color":"#ffffff","hillshade-accent-color":"#5c6a61"}},map.getLayer("gd")?"gd":undefined);
  map.setLayoutProperty("hill","visibility",relief?"visible":"none");
  try{map.setPaintProperty("hill","hillshade-exaggeration",relief?.6:.35)}catch{}
  map.setTerrain(relief?{source:"dem",exaggeration:exag}:null);
  try{map.setSky(relief?{"sky-color":"#8fbbe6","horizon-color":"#dfe9f2","fog-color":"#e8eef2","sky-horizon-blend":.5,"horizon-fog-blend":.6,"fog-ground-blend":.25,"atmosphere-blend":["interpolate",["linear"],["zoom"],0,1,12,.6,14,0]}:{})}catch{}
  const ex=document.getElementById("exg");if(ex)ex.hidden=!relief;
  map.dragRotate[relief?"enable":"disable"]();map.touchZoomRotate[relief?"enableRotation":"disableRotation"]();map.touchPitch?.[relief?"enable":"disable"]?.();
  document.getElementById("d3").setAttribute("aria-pressed",relief);
}
document.getElementById("d3").onclick=()=>{relief=!relief;try{localStorage.setItem("cgr-3d",relief?"1":"0")}catch{}
  applyRelief();if(relief){map.easeTo({pitch:62,bearing:map.getBearing()||-20,zoom:Math.min(map.getZoom(),12.3),duration:1100});msg("Relief en 3D : deux doigts pour incliner et tourner ; « Relief ×… » pour l'accentuer.",6000)}else map.easeTo({pitch:0,bearing:0,duration:600})};
function overlay(){
  if(map.getSource("trk")){applyRelief();return}
  map.addSource("trk",{type:"geojson",data:{type:"Feature",properties:{},geometry:{type:"LineString",coordinates:precise||[]}}});
  map.addSource("mk",{type:"geojson",data:{type:"FeatureCollection",features:marks.map(m=>({type:"Feature",properties:{l:m.l},geometry:{type:"Point",coordinates:[m.lng,m.lat]}}))}});
  map.addSource("me",{type:"geojson",data:{type:"FeatureCollection",features:[]}});
  const w=k=>["interpolate",["linear"],["zoom"],8,2.2*k,13,3.4*k,17,6*k];
  map.addSource("gd",{type:"geojson",data:{type:"Feature",properties:{},geometry:{type:"LineString",coordinates:precise?[]:guide}}});
  map.addLayer({id:"gd",type:"line",source:"gd",layout:{"line-join":"round","line-cap":"round"},paint:{"line-color":"#cf1734","line-opacity":.55,"line-width":2,"line-dasharray":[1.5,1.5]}});
  // approche à pied gare ↔ sentier (repères « Départ · gare … » / « Arrivée · gare … » envoyés par l'appli) : pointillés verts
  if(track.length>1){const T0=track[0],T1=track[track.length-1],ap=apPaths.length?apPaths.map(l=>({type:"Feature",properties:{},geometry:{type:"LineString",coordinates:l}})):marks.filter(m=>/^(Départ|Arrivée) · gare/.test(m.l)).map(m=>({type:"Feature",properties:{},geometry:{type:"LineString",coordinates:[[m.lng,m.lat],/^Départ/.test(m.l)?T0:T1]}}));
    if(ap.length){map.addSource("ap",{type:"geojson",data:{type:"FeatureCollection",features:ap}});map.addLayer({id:"ap",type:"line",source:"ap",layout:{"line-cap":"round"},paint:{"line-color":"#2c7a4c","line-width":3,"line-dasharray":[1.2,1.4]}})}}
  if(track.length>1){
    map.addLayer({id:"trk-h",type:"line",source:"trk",layout:{"line-join":"round","line-cap":"round"},paint:{"line-color":"#fff","line-opacity":.85,"line-width":w(1.9)}});
    map.addLayer({id:"trk",type:"line",source:"trk",layout:{"line-join":"round","line-cap":"round"},paint:{"line-color":"#cf1734","line-opacity":.9,"line-width":w(1)}});
  }
  map.addLayer({id:"mk",type:"circle",source:"mk",paint:{"circle-radius":5.5,"circle-color":"#16201a","circle-stroke-color":"#fff","circle-stroke-width":2}});
  map.addLayer({id:"mk-l",type:"symbol",source:"mk",layout:{"text-field":["get","l"],"text-font":["Source Sans Pro Bold"],"text-size":13,"text-anchor":"left","text-offset":[.8,-.4],"text-optional":true},paint:{"text-color":"#111714","text-halo-color":"#fff","text-halo-width":2}});
  map.addLayer({id:"me-a",type:"circle",source:"me",paint:{"circle-radius":16,"circle-color":"#1a73e8","circle-opacity":.18}});
  map.addLayer({id:"me",type:"circle",source:"me",paint:{"circle-radius":7,"circle-color":"#1a73e8","circle-stroke-color":"#fff","circle-stroke-width":2.5}});
  if(here)setHere(here);
  applyRelief();
}
map.on("style.load",overlay);
/* Hors de France (demande de Louis, 18 nov.) : les fonds IGN s'arrêtent à la frontière. Dessous, OpenTopoMap (OSM, toute l'Europe) :
   courbes de niveau, villes et villages, lacs, rivières. En France le fond IGN, opaque, le recouvre. */
const WORLD={type:"raster",tiles:["a","b","c"].map(x=>"https://"+x+".tile.opentopomap.org/{z}/{x}/{y}.png"),tileSize:256,maxzoom:17,attribution:'Hors France : © <a href="https://opentopomap.org" target="_blank" rel="noopener">OpenTopoMap</a> (CC-BY-SA), © OpenStreetMap'};
function world(){try{if(map.getSource("world"))return;map.addSource("world",WORLD);
  const first=map.getStyle().layers[0]?.id;map.addLayer({id:"world",type:"raster",source:"world",paint:{"raster-opacity":.9,"raster-fade-duration":0}},first);
  /* le fond blanc du Plan IGN déborde largement de la frontière (lac de Côme blanc) : on l'efface et on masque seulement la France */
  if(map.getLayer("bckgrd")){map.setPaintProperty("bckgrd","fill-opacity",0);map.addSource("fr",{type:"geojson",data:new URL("france.json",location.href).href});
    map.addLayer({id:"frmask",type:"fill",source:"fr",paint:{"fill-color":"#fff","fill-antialias":false}},"bckgrd")}
  rasterFr()}catch{}}
/* « Classique » et « Photos » (images IGN) sont blanches hors de France : quand le centre de la carte sort de France, on les cache
   et OpenTopoMap prend le relais. */
let FR=null;fetch("france.json").then(r=>r.json()).then(j=>{FR=j.geometry.type==="Polygon"?[j.geometry.coordinates]:j.geometry.coordinates;rasterFr()}).catch(()=>{});
function inFr(x,y){if(!FR)return true;for(const poly of FR){let c=false;const r=poly[0];for(let i=0,j=r.length-1;i<r.length;j=i++){const a=r[i],b=r[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c}if(c)return true}return false}
function rasterFr(){try{if(!map.getLayer("r"))return;const c=map.getCenter(),v=map.getZoom()<7||inFr(c.lng,c.lat)?"visible":"none";if(map.getLayoutProperty("r","visibility")!==v)map.setLayoutProperty("r","visibility",v)}catch{}}
map.on("moveend",rasterFr);
map.on("style.load",world);if(map.isStyleLoaded())world();
map.on("error",e=>{if(/standard\.json|Failed to fetch/.test(String(e?.error?.message||""))&&base==="plan"){msg("Le Plan IGN ne répond pas : je passe sur la carte classique.");setBase("topo")}});
function setBase(b){base=b;try{localStorage.setItem("cgr-fond",b)}catch{}document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.b===b));map.setStyle(BASES[b],{diff:false})}
document.querySelectorAll(".seg button").forEach(x=>{x.setAttribute("aria-pressed",x.dataset.b===base);x.onclick=()=>setBase(x.dataset.b)});
document.getElementById("fit").onclick=()=>{if(bounds)map.fitBounds(bounds,{padding:{top:80,bottom:50,left:40,right:60},duration:400})};
let here=null,watch=null;
function setHere(c){here=c;map.getSource("me")?.setData({type:"FeatureCollection",features:[{type:"Feature",properties:{},geometry:{type:"Point",coordinates:c}}]})}
document.getElementById("loc").onclick=()=>{
  if(!navigator.geolocation)return msg("Ce navigateur ne donne pas la position.");
  if(watch!=null&&here)return map.easeTo({center:here,zoom:Math.max(map.getZoom(),15)});
  msg("Je cherche ta position…",0);let first=true;
  watch=navigator.geolocation.watchPosition(p=>{setHere([p.coords.longitude,p.coords.latitude]);if(first){first=false;msg("");map.easeTo({center:here,zoom:Math.max(map.getZoom(),15)})}},e=>{msg(e.code===1?"Position refusée : autorise-la dans les réglages du navigateur.":"Position introuvable pour l'instant.");navigator.geolocation.clearWatch(watch);watch=null},{enableHighAccuracy:true,maximumAge:5000});
};
const esc=s=>s.replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const G=document.getElementById("gpx");if(track.length<2)G.hidden=true;

/* ---------- calage du tracé : le tracé de l'appli est simplifié (un point tous les ~500 m). On le cale :
   1) sur le balisage officiel du sentier (relation OpenStreetMap, par Overpass) quand on connaît son numéro ;
   2) sinon (ou si ça couvre mal) sur le réseau de chemins de l'IGN (BD TOPO, tronçons de route, sentiers compris).
   Méthode (comme scripts/precise_track.py) : réseau du couloir, puis de repère en repère (tous les 1,5 km), plus court chemin
   en pénalisant l'écart au tracé simplifié ; un morceau qui ne colle pas garde le tracé simplifié. Résultat gardé dans le navigateur. */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function getJSON(url,opt={},ms=30000){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,Object.assign({signal:c.signal},opt));if(!r.ok)throw new Error("HTTP "+r.status);return await r.json()}finally{clearTimeout(t)}}
function densify(L,step=.05){const o=[L[0]];for(let i=1;i<L.length;i++){const a=L[i-1],b=L[i],n=Math.max(1,Math.floor(hav(a,b)/step));for(let k=1;k<=n;k++)o.push([a[0]+(b[0]-a[0])*k/n,a[1]+(b[1]-a[1])*k/n])}return o}
function nearIdx(D){const g=new Map();for(const p of D){const k=Math.floor(p[1]*900)+":"+Math.floor(p[0]*650);(g.get(k)||g.set(k,[]).get(k)).push(p)}
  return (p,R=2)=>{const a=Math.floor(p[1]*900),b=Math.floor(p[0]*650);let best=9;for(let i=a-R;i<=a+R;i++)for(let j=b-R;j<=b+R;j++){const L=g.get(i+":"+j);if(L)for(const q of L){const d=hav(p,q);if(d<best)best=d}}return best}}
const PEN={"Sentier":1,"Chemin":1,"Route empierrée":1,"Escalier":1.1,"Route à 1 chaussée":1.15,"osm":1};
function graph(lines,near,buf=.6){ // lines : [{c:[[lon,lat,(z)],…],n:nature}]
  const G=new Map(),Z=new Map(),K=p=>p[0].toFixed(6)+","+p[1].toFixed(6);
  for(const ln of lines){const pen=PEN[ln.n]||1.6;const c=ln.c;for(let i=1;i<c.length;i++){const a=c[i-1],b=c[i];const off=near([(a[0]+b[0])/2,(a[1]+b[1])/2]);if(off>buf)continue;
    const d=hav(a,b),w=d*pen*(1+6*off),u=K(a),v=K(b);if(u===v)continue;(G.get(u)||G.set(u,[]).get(u)).push([v,w]);(G.get(v)||G.set(v,[]).get(v)).push([u,w]);if(a[2]!=null)Z.set(u,a[2]);if(b[2]!=null)Z.set(v,b[2])}}
  const idx=new Map();for(const k of G.keys()){const [lo,la]=k.split(",").map(Number);const key=Math.floor(la*200)+":"+Math.floor(lo*140);(idx.get(key)||idx.set(key,[]).get(key)).push([lo,la,k])}
  return {G,Z,idx}}
function nearestNode(N,p){let best=null,bd=9;const a=Math.floor(p[1]*200),b=Math.floor(p[0]*140);for(let i=a-1;i<=a+1;i++)for(let j=b-1;j<=b+1;j++){const L=N.idx.get(i+":"+j);if(L)for(const q of L){const d=hav(p,q);if(d<bd){bd=d;best=q[2]}}}return [best,bd]}
function dijkstra(G,s,t,limit){const dist=new Map([[s,0]]),prev=new Map(),H=[[0,s]];
  const push=x=>{H.push(x);let i=H.length-1;while(i){const p=(i-1)>>1;if(H[p][0]<=H[i][0])break;[H[p],H[i]]=[H[i],H[p]];i=p}};
  const pop=()=>{const top=H[0],last=H.pop();if(H.length){H[0]=last;let i=0;for(;;){const l=2*i+1,r=l+1;let m=i;if(l<H.length&&H[l][0]<H[m][0])m=l;if(r<H.length&&H[r][0]<H[m][0])m=r;if(m===i)break;[H[m],H[i]]=[H[i],H[m]];i=m}}return top};
  while(H.length){const [c,u]=pop();if(u===t)break;if(c>(dist.get(u)??1e9)||c>limit)continue;for(const [v,w] of G.get(u)||[]){const nc=c+w;if(nc<(dist.get(v)??1e9)){dist.set(v,nc);prev.set(v,u);push([nc,v])}}}
  if(!dist.has(t))return null;const path=[t];while(path[path.length-1]!==s)path.push(prev.get(path[path.length-1]));return path.reverse()}
function snapOn(lines,D,near){
  const N=graph(lines,near);if(!N.G.size)return null;
  const marks=[0];let acc=0;for(let i=1;i<D.length;i++){acc+=hav(D[i-1],D[i]);if(acc>=1.5){marks.push(i);acc=0}}if(marks[marks.length-1]!==D.length-1)marks.push(D.length-1);
  let out=[],z=[],ok=0,tot=0;
  for(let m=1;m<marks.length;m++){const piece=D.slice(marks[m-1],marks[m]+1),L=lenKm(piece);tot+=L;
    const [s,ds]=nearestNode(N,piece[0]),[t,dt]=nearestNode(N,piece[piece.length-1]);
    const path=s&&t&&ds<.15&&dt<.15?dijkstra(N.G,s,t,L*6):null;
    if(path){const Pp=path.map(k=>k.split(",").map(Number)),Lp=lenKm(Pp);if(Lp>=.85*L&&Lp<=1.6*L+.3){const add=out.length?Pp.slice(1):Pp;out=out.concat(add);z=z.concat((out.length===add.length?path:path.slice(1)).map(k=>N.Z.get(k)??null));ok+=L;continue}}
    const add=out.length?piece.slice(1):piece;out=out.concat(add);z=z.concat(add.map(()=>null))}

  const P=[],E=[],seen=new Map();for(let i=0;i<out.length;i++){const k=out[i][0].toFixed(5)+","+out[i][1].toFixed(5);const j=seen.get(k);
    if(j!=null&&P.length-j<400){for(let q=j+1;q<P.length;q++)seen.delete(P[q][0].toFixed(5)+","+P[q][1].toFixed(5));P.length=j+1;E.length=j+1;continue}
    if(P.length&&hav(P[P.length-1],out[i])<.002)continue;seen.set(k,P.length);P.push(out[i]);E.push(z[i]==null?null:Math.round(z[i]))}

const OVERPASS=["https://overpass-api.de/api/interpreter","https://overpass.private.coffee/api/interpreter","https://maps.mail.ru/osm/tools/overpass/api/interpreter"];
function bboxOf(L,m=.01){let a=[180,90,-180,-90];for(const p of L){a=[Math.min(a[0],p[0]),Math.min(a[1],p[1]),Math.max(a[2],p[0]),Math.max(a[3],p[1])]}return [a[0]-m*1.4,a[1]-m,a[2]+m*1.4,a[3]+m]}
async function osmLines(id,D){const b=bboxOf(D);const q="[out:json][timeout:40];rel("+id+");(._;>>;)->.a;way.a("+[b[1],b[0],b[3],b[2]].map(x=>x.toFixed(4)).join(",")+");out geom;";
  for(const u of OVERPASS){try{const j=await getJSON(u,{method:"POST",body:"data="+encodeURIComponent(q),headers:{"Content-Type":"application/x-www-form-urlencoded"}},45000);
    const L=(j.elements||[]).filter(e=>e.type==="way"&&e.geometry?.length>1).map(e=>({n:"osm",c:e.geometry.map(g=>[g.lon,g.lat])}));if(L.length)return L}catch(e){console.warn("overpass",u,e)}}
  return null}
async function ignLines(D,progress){const boxes=new Set();for(const p of D)boxes.add(Math.floor(p[1]/.04)+":"+Math.floor(p[0]/.04));const B=[...boxes];let done=0;const lines=[];
  async function one(k){const [i,j]=k.split(":").map(Number);const s=i*.04-.008,w=j*.04-.011,n=s+.056,e=w+.062;let start=0;
    for(;;){const u="https://data.geopf.fr/wfs/ows?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetFeature&TYPENAMES=BDTOPO_V3:troncon_de_route&OUTPUTFORMAT=application/json&SRSNAME=EPSG:4326&PROPERTYNAME=nature,geometrie&COUNT=5000&STARTINDEX="+start+"&BBOX="+[w,s,e,n].map(x=>x.toFixed(4)).join(",")+",EPSG:4326";
      let d=null;for(let t=0;t<3&&!d;t++){try{d=await getJSON(u,{},40000)}catch(e){await sleep(1500*(t+1))}}if(!d)break;
      const F=d.features||[];for(const f of F){const g=f.geometry||{};const n=f.properties?.nature||"";(g.type==="LineString"?[g.coordinates]:g.type==="MultiLineString"?g.coordinates:[]).forEach(c=>lines.push({n,c}))}
      start+=F.length;if(F.length<5000)break}
    progress(++done,B.length)}
  const Q=B.slice();await Promise.all([0,1,2,3].map(async()=>{while(Q.length)await one(Q.shift())}));return lines}
function cacheKey(){let h=0;const s=(P.get("t")||"")+"|"+osmId;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return "cgr-cale-v1-"+h}
function usePrecise(r,src){precise=r.pts;eles=r.ele;track=precise;map.getSource("trk")?.setData({type:"Feature",properties:{},geometry:{type:"LineString",coordinates:precise}});map.getSource("gd")?.setData({type:"Feature",properties:{},geometry:{type:"LineString",coordinates:[]}});setTitle();
  try{onTrack()}catch(e){console.warn(e)}
  const pc=Math.round(r.cale*100);msg(pc>=97?"Tracé calé "+src+".":"Tracé calé "+src+" ("+pc+" % ; le reste, en pointillé fin, suit le tracé simplifié).",6000)}
async function calage(){
  if(guide.length<2)return;
  try{const c=JSON.parse(localStorage.getItem(cacheKey())||"null");if(c?.pts?.length>1){await mapReady;return usePrecise(c,c.src)}}catch{}
  const D=densify(guide),near=nearIdx(D);if(lenKm(guide)>400){msg("Parcours très long : tracé simplifié (ouvre une section plus courte pour le tracé précis).",8000);return}
  msg("Je cale le tracé sur les sentiers balisés…",0);
  let best=null,src="";
  if(osmId){const L=await osmLines(osmId,D);if(L){const r=snapOn(L,D,near);if(r&&r.cale>=.8){best=r;src="sur le balisage officiel du sentier (OpenStreetMap)"}}}
  if(!best){const L=await ignLines(D,(a,b)=>msg("Je cale le tracé sur les chemins IGN… "+Math.round(100*a/b)+" %",0));const r=L.length?snapOn(L,D,near):null;if(r&&r.cale>=.3){best=r;src="sur les chemins de l'IGN"}}
  await mapReady;
  if(!best)return msg("Je n'ai pas pu caler le tracé : tracé simplifié affiché (pointillés).",8000);
  usePrecise(best,src);try{localStorage.setItem(cacheKey(),JSON.stringify({pts:best.pts.map(p=>[+p[0].toFixed(6),+p[1].toFixed(6)]),ele:best.ele,cale:best.cale,src}))}catch{}
}
map.once('load',()=>{if(relief)map.easeTo({pitch:62,duration:0})});
const mapReady=new Promise(r=>{if(map.loaded())r();else map.once("load",r)});
calage();
if(track.length<2)msg("Ouvre cette page depuis Carnet GR (bouton « Carte IGN complète ») pour voir un parcours.",9000);
</script>
<script>
/* ---------- extras : profil d'altitude, suivi en direct, survol 3D, couches, hors-ligne ---------- */
const $=id=>document.getElementById(id);

function sample(L,step){const o=[],cum=[0];for(let i=1;i<L.length;i++)cum.push(cum[i-1]+hav(L[i-1],L[i]));const tot=cum[cum.length-1];if(tot<=0)return o;

async function altitudes(P){const out=[];for(let k=0;k<P.length;k+=150){const ch=P.slice(k,k+150);let ok=false;

  if(!ok)ch.forEach(()=>out.push(null))}return out}
function fillGaps(z){let last=null;const o=z.slice();for(let i=0;i<o.length;i++){if(o[i]==null)o[i]=last;else last=o[i]}last=null;for(let i=o.length-1;i>=0;i--){if(o[i]==null)o[i]=last;else last=o[i]}return o}
function stats(S){let up=0,dn=0,ref=S[0].z,mn=1e9,mx=-1e9;for(const p of S){mn=Math.min(mn,p.z);mx=Math.max(mx,p.z);if(p.z-ref>=3){up+=p.z-ref;ref=p.z}else if(ref-p.z>=3){dn+=ref-p.z;ref=p.z}}return{up,dn,mn,mx}}

function live(c){const el=$("live");if(!SM||SM.length<2){return}let bi=0,bd=99;SM.forEach((p,i)=>{const d=hav(p.ll,c);if(d<bd){bd=d;bi=i}});

  const h=rem/5+up/600,eta=new Date(Date.now()+h*3600e3),hm=eta.getHours()+" h "+String(eta.getMinutes()).padStart(2,"0");
  el.classList.add("on");const off=bd>.15;el.classList.toggle("warn",off);
  el.textContent=off?`Tu t'écartes du tracé (${Math.round(bd*1000)} m). Retour au plus près : ${fmtKm(SM[bi].d)} du départ.`:`Il reste ${fmtKm(rem)} · +${Math.round(up)} m · arrivée vers ${hm}`;
  if(!off)curAt(bi)}
/* survol du parcours : ▶3D = caméra basse dans le relief (le terrain s'active tout seul), ▶2D = vue du dessus, nord en haut */
let flying=0,flyMode=null,flyRestore=null;
function setFlyBtn(m){["3","2"].forEach(k=>{const b=$("fly"+k);b.setAttribute("aria-pressed",m===k);b.textContent=m===k?"■":("▶"+k+"D")})}
function stopFly(){if(!flying&&!flyMode)return;const m=flyMode;$("spd").hidden=true;cancelAnimationFrame(flying);flying=0;flyMode=null;setFlyBtn(null);
  try{if(m==="3"&&relief)map.setTerrain({source:"dem",exaggeration:exag});if(m==="2"&&flyRestore?.relief){relief=true;store.set("cgr-3d","1");applyRelief()}}catch{}flyRestore=null}
let flySpeed=1;
async function startFly(mode){
  if(flyMode)return stopFly();const L=(precise||track);if(!L||L.length<2)return;
  flyMode=mode;setFlyBtn(mode);showProf(false);flyRestore={relief};$("spd").hidden=false;
  if(mode==="3"){ // relief obligatoire : on l'active, on attend que les altitudes soient là, puis on renforce un peu le relief
    if(!relief){relief=true;store.set("cgr-3d","1");applyRelief()}
    msg("Je charge le relief…",0);map.jumpTo({pitch:66,zoom:12.2});await new Promise(r=>{let done=false;const f=()=>{if(!done){done=true;r()}};map.once("idle",f);setTimeout(f,4500)});msg("");if(flyMode!==mode)return;
    try{map.setTerrain({source:"dem",exaggeration:Math.max(exag,2)})}catch{}
  }else{ if(relief){relief=false;store.set("cgr-3d","0");applyRelief()} map.jumpTo({pitch:0,bearing:0,zoom:13}); }
  const S2=sample(L,Math.max(.03,lenKm(L)/700)),tot=S2[S2.length-1].d; // vitesse de base : ≈ 2,5 km par seconde, entre 15 et 50 s pour tout le parcours
  const base=Math.min(50,Math.max(15,tot/2.5));let pos=0,last=performance.now(),brg=map.getBearing();
  const step=now=>{const dt=Math.max(0,Math.min(.1,(now-last)/1000));last=now;pos+=dt/base*flySpeed;const t=Math.max(0,Math.min(1,pos)),f=t*(S2.length-1),i=Math.floor(f),a=S2[i],b=S2[Math.min(S2.length-1,i+1)],k=f-i,ll=[a.ll[0]+(b.ll[0]-a.ll[0])*k,a.ll[1]+(b.ll[1]-a.ll[1])*k];
    if(mode==="3"){const ahead=S2[Math.min(S2.length-1,i+Math.ceil(S2.length/30))].ll,tb=Math.atan2((ahead[0]-ll[0])*Math.cos(ll[1]*Math.PI/180),ahead[1]-ll[1])*180/Math.PI;let dd=((tb-brg+540)%360)-180;brg+=dd*.05;map.jumpTo({center:ll,bearing:brg,pitch:66,zoom:12.2})}
    else map.jumpTo({center:ll,bearing:0,pitch:0,zoom:13});
    if(t<1)flying=requestAnimationFrame(step);else stopFly()};
  map.jumpTo({center:S2[0].ll});flying=requestAnimationFrame(step)}
document.querySelectorAll("#spd button").forEach(b=>b.onclick=()=>{flySpeed=+b.dataset.s;document.querySelectorAll("#spd button").forEach(x=>x.setAttribute("aria-pressed",x===b))});
/* Garde la caméra au-dessus du relief exagéré (à ×4-×5 elle passait SOUS les montagnes : image floue et étirée).
   Hauteur de la caméra au-dessus du centre = distance caméra-centre × mètres par pixel × cos(inclinaison) ; on compare au plus haut
   relief (relatif au centre, déjà multiplié par l'exagération) sur un cercle de ≈ 1,5 fois la distance au sol, et on recule le zoom. */
function keepAbove(){try{if(!relief||!map.getTerrain())return;const t=map.transform,c=map.getCenter(),z=map.getZoom(),pit=map.getPitch()*Math.PI/180;
  const mpp=40075016*Math.cos(c.lat*Math.PI/180)/(512*2**z),h=t.cameraToCenterDistance*mpp*Math.cos(pit),R=Math.max(1500,t.cameraToCenterDistance*mpp*Math.sin(pit)*1.5);
  let top=0;for(let i=0;i<=4;i++)for(let k=0;k<12;k++){const r=R*i/4,a=k*Math.PI/6,dl=r*Math.cos(a)/111320,dg=r*Math.sin(a)/(111320*Math.cos(c.lat*Math.PI/180));const e=map.queryTerrainElevation([c.lng+dg,c.lat+dl]);if(e>top)top=e;if(!i)break}
  const need=top+400;if(need>h){const nz=Math.max(3,z-Math.log2(need/h)-.05);if(z-nz>.04)map.easeTo({zoom:nz,duration:500})}}catch{}}
map.on("moveend",()=>{if(relief&&exag>2)setTimeout(keepAbove,50)});
/* Relief : curseur ×1 (vraie échelle) à ×5, aimanté sur ×1 ×1,5 ×2 ×2,5 ×3 ×4 ×5 (demande de Louis, 17 nov.) */
(function(){const STOPS=[1,1.5,2,2.5,3,4,5],r=document.getElementById("exr"),v=document.getElementById("exv"),tk=document.querySelector(".exticks");
  const th=14,pos=x=>"calc("+((x-1)/4*100)+"% + "+(th*(1-2*(x-1)/4)/2)+"px)";
  tk.innerHTML=STOPS.map(x=>'<span style="left:'+pos(x)+'">'+String(x).replace(".",",")+'</span>').join("");
  const near=x=>STOPS.reduce((a,b)=>Math.abs(b-x)<Math.abs(a-x)?b:a);
  const show=x=>{v.textContent="×"+String(x).replace(".",",");r.setAttribute("aria-valuetext",x===1?"vraie échelle":"×"+x)};
  const apply=x=>{exag=x;show(x);if(relief)try{map.setTerrain({source:"dem",exaggeration:x});clearTimeout(apply.t);apply.t=setTimeout(keepAbove,250)}catch{}};
  if(!STOPS.includes(exag))exag=near(exag);r.value=exag;show(exag);
  r.addEventListener("input",()=>{const x=+r.value,n=near(x);apply(Math.abs(x-n)<.18?n:Math.round(x*10)/10)});
  r.addEventListener("change",()=>{const n=near(+r.value);r.value=n;apply(n);store.set("cgr-exag",String(n));if(navigator.vibrate)try{navigator.vibrate(8)}catch{}})})();
$("fly3").onclick=()=>startFly("3");$("fly2").onclick=()=>startFly("2");
["mousedown","touchstart","wheel"].forEach(e=>map.getCanvas().addEventListener(e,stopFly,{passive:true}));
/* hors-ligne : service worker (cache des tuiles déjà vues) + téléchargement de la zone du parcours */
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{});
  /* nouvelle version de la carte installée alors qu'une ancienne copie est affichée : recharge une fois pour l'afficher */
  navigator.serviceWorker.addEventListener("controllerchange",()=>{let k=null;try{k=sessionStorage.getItem("cgr-rl");sessionStorage.setItem("cgr-rl","1")}catch{}if(had&&!k)location.reload()})}
const tileXY=(lon,lat,z)=>{const n=2**z;return[Math.floor((lon+180)/360*n),Math.floor((1-Math.log(Math.tan(lat*Math.PI/180)+1/Math.cos(lat*Math.PI/180))/Math.PI)/2*n)]};
$("off").onclick=async()=>{
  if(!("caches" in window)||!navigator.serviceWorker?.controller)return msg("Le mode hors-ligne s'active après une première visite : recharge la page puis réessaie.",7000);
  const L=(precise||track);if(!L||L.length<2)return msg("Aucun parcours à garder.");const S=sample(L,.25).map(p=>p.ll);
  let style=null;try{style=await (await fetch(BASES.plan)).json()}catch{}
  const vec=style&&Object.values(style.sources||{}).find(s=>s.type==="vector"&&s.tiles?.length);const urls=new Set();
  const add=(tpl,z0,z1,rad,sub)=>{for(let z=z0;z<=z1;z++){const t=new Set();for(const p of S){const [x,y]=tileXY(p[0],p[1],z);for(let a=-rad;a<=rad;a++)for(let b=-rad;b<=rad;b++)t.add((x+a)+"/"+(y+b))}for(const k of t){const [x,y]=k.split("/");urls.add(tpl.replace("{z}",z).replace("{x}",x).replace("{y}",y))}}};
  if(vec)add(vec.tiles[0],9,Math.min(vec.maxzoom||15,15),1);
  add(wmts("GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2","image/png"),10,16,0);
  add(DEM.tiles[0],9,13,1);
  const list=[...urls];if(list.length>6000)return msg("Parcours trop long pour le hors-ligne ("+list.length+" tuiles) : ouvre une section plus courte.",8000);
  let done=0,bytes=0;const b=$("off");b.disabled=true;let i=0;
  async function w(){while(i<list.length){const u=list[i++];try{const r=await fetch(u);if(r.ok){const c=await r.clone().blob();bytes+=c.size}}catch{}done++;if(done%10===0||done===list.length)msg("Je garde la zone… "+Math.round(100*done/list.length)+" % ("+(bytes/1e6).toFixed(0)+" Mo)",0)}}
  await Promise.all([w(),w(),w(),w(),w(),w()]);b.disabled=false;msg("Zone gardée hors-ligne : "+list.length+" tuiles, ≈ "+(bytes/1e6).toFixed(0)+" Mo. Carte, relief et tracé marchent sans réseau (le fond « Photos » n'est pas gardé).",9000);store.set("cgr-off",String(Date.now()))};
mapReady.then(()=>setTimeout(onTrack,0));

<script>
/* ---------- Tous les sentiers (demande de Louis, 17 nov. 2026) : de loin les grands itinéraires, en zoomant les régionaux puis les locaux ;
   « Chemins d'hiver » = raquettes et randonnée hivernale balisées. Données : sentiers/*.pmtiles (tracés OpenStreetMap, ODbL). */
(function(){
  /* Tuiles vectorielles PMTiles (sentiers/<pays>.pmtiles, géométrie OSM complète, script pays/commun/carte_tuiles.py) : la carte ne lit que

  /* [fichier, type] : tous = sentiers balisés + raquettes ; hiver = sentiers classés pour l'hiver. Limite GitHub 100 Mo par fichier :
     France + Suisse dans tous/hiver, puis un fichier par pays (it = Italie du Nord, de = Allemagne du Sud). */
  const FILES=[["tous","tous"],["hiver","hiver"],["it","tous"],["it-hiver","hiver"],["de","tous"],["de-hiver","hiver"]];
  /* couches : sl = couche des tuiles ; hok/hrisk = sentiers classés pour l'hiver (pente du terrain ≥ 30° à moins de 120 m → à éviter) */
  const LAY=[
    {id:"gr",sl:"gr",s:"ete",c:"#cf1734",z:0,w:[5,1.6,9,2.6,14,4],t:9},
    {id:"regionaux",sl:"regionaux",s:"ete",c:"#e07b00",z:8,w:[8,1.4,14,3.2],t:11.5},
    {id:"locaux",sl:"locaux",s:"ete",c:"#3b6fd6",z:10,w:[10,1.2,15,2.6],t:13.5},
    {id:"hok",sl:"hok",fi:"hiver",s:"hiver",c:"#2457b8",z:9,w:[9,1.2,14,3],t:12.5},
    {id:"hwarn",sl:"hwarn",fi:"hiver",s:"hiver",c:"#e07b00",z:11,w:[11,1.2,15,2.6],t:14,dash:[2,1.2],op:.8},
    {id:"hrisk",sl:"hrisk",fi:"hiver",s:"hiver",c:"#c62828",z:11,w:[11,1.2,15,2.6],t:14,dash:[1.2,1.6],op:.75},
    {id:"hiver",sl:"hiver",s:"hiver",c:"#0b9bb5",z:9,w:[9,2.2,14,5],t:11.5,f:["!=",["get","a"],1]},
    {id:"hiverx",sl:"hiver",s:"hiver",c:"#0b9bb5",z:9,w:[9,2.2,14,5],t:11.5,f:["==",["get","a"],1],dash:[2,1.4]}];
  let on=false,saison="ete";try{saison=localStorage.getItem("cgr-saison")||"ete"}catch{}
  try{if(window.pmtiles&&!window._pmp){window._pmp=new pmtiles.Protocol();maplibregl.addProtocol("pmtiles",window._pmp.tile)}}catch{}
  const FLAG={FR:"🇫🇷",CH:"🇨🇭",IT:"🇮🇹",DE:"🇩🇪",AT:"🇦🇹",ES:"🇪🇸"};const KN={gr:"grand itinéraire (GR)",regionaux:"GR de Pays / itinéraire régional",locaux:"sentier local (PR)",hiver:"itinéraire raquettes / randonnée hivernale balisé"};
  function info(q){
    if(q.k==="hok")return (FLAG[q.p]||"")+" "+q.n+" · praticable l'hiver : aucune pente de 30° ou plus à moins de 120 m, ou seulement des pentes basses (sous 1 000 m) où la neige tient rarement (repère, à confirmer avec le bulletin d'avalanche et l'enneigement du jour).";
    if(q.k==="hwarn")return (FLAG[q.p]||"")+" "+q.n+" · prudence l'hiver : pente de 30° ou plus (≈ 58 %) à moins de 120 m, culminant entre 1 000 et 1 500 m. Avalanches possibles après de fortes chutes de neige : regarde le bulletin.";
    if(q.k==="hrisk")return (FLAG[q.p]||"")+" "+q.n+" · à éviter l'hiver : pente de 30° ou plus (≈ 58 %) à moins de 120 m culminant au-dessus de 1 500 m (zone où partent les avalanches), ou passage alpin / via ferrata / glacier.";
    return (FLAG[q.p]||"")+" "+q.n+" · "+(KN[q.k]||q.k)+" · "+String(q.km||"").replace(".",",")+" km"+(q.d?" · "+q.d+" m D+":"")+(q.a==1?" · tracé approximatif dans OpenStreetMap (pointillés)":"")}
  async function draw(){
    for(const [f,ty] of FILES){const src="all-"+f;
      const mine=LAY.filter(L=>(L.fi||"tous")===ty);if(!mine.length)continue;
      if(on&&mine.some(L=>L.s===saison)&&!map.getSource(src))map.addSource(src,{type:"vector",url:"pmtiles://"+new URL("sentiers/"+f+".pmtiles",location.href).href,attribution:"Sentiers © OpenStreetMap · relief Copernicus"});
      for(const L of mine){const id=src+"-"+L.id,lb=id+"-n";const show=on&&L.s===saison;
        if(!show){for(const x of [id,lb])if(map.getLayer(x))map.setLayoutProperty(x,"visibility","none");continue}
        if(!map.getLayer(id)){const before=map.getLayer("gd")?"gd":undefined,op=L.op||.85;
          const ln={id,type:"line",source:src,"source-layer":L.sl,minzoom:L.z,layout:{"line-join":"round","line-cap":L.dash?"butt":"round"},paint:{"line-color":L.c,"line-opacity":op,"line-width":["interpolate",["linear"],["zoom"],...L.w]}};
          if(L.dash)ln.paint["line-dasharray"]=L.dash;if(L.f)ln.filter=L.f;map.addLayer(ln,before);
          const sy={id:lb,type:"symbol",source:src,"source-layer":L.sl,minzoom:L.t,layout:{"symbol-placement":"line","symbol-spacing":320,"text-field":L.id==="hrisk"?["concat","⚠ ",["get","n"]]:L.id==="hwarn"?["concat","! ",["get","n"]]:["get","n"],"text-font":["Source Sans Pro Bold"],"text-size":["interpolate",["linear"],["zoom"],L.t,11,16,14],"text-max-angle":35,"text-padding":4,"text-offset":[0,-.75]},paint:{"text-color":L.c,"text-halo-color":"#fff","text-halo-width":1.8}};
          if(L.f)sy.filter=L.f;map.addLayer(sy,before);
          map.on("click",id,e=>{const q=e.features?.[0]?.properties;if(q)msg(info(q),9000)});
          map.on("mouseenter",id,()=>map.getCanvas().style.cursor="pointer");map.on("mouseleave",id,()=>map.getCanvas().style.cursor="")}
        else for(const x of [id,lb])map.setLayoutProperty(x,"visibility","visible")}}
  }
  const HMSG="Hiver : bleu = praticable ; turquoise = raquettes balisées ; pointillés orange = prudence (pente raide entre 1 000 et 1 500 m) ; pointillés rouges = à éviter (pente raide au-dessus de 1 500 m, passage alpin). Repère seulement : vérifie toujours le bulletin d'avalanche.";
  function setOn(v){on=v;document.getElementById("allb").setAttribute("aria-pressed",on);document.getElementById("saison").hidden=!on;try{localStorage.setItem("cgr-tous",on?"1":"0")}catch{}
    if(on){msg(saison==="hiver"?HMSG:"De loin : les grands itinéraires. Zoome pour voir les régionaux, puis les sentiers locaux.",6000)}draw()}
  document.getElementById("allb").onclick=()=>setOn(!on);
  document.querySelectorAll("#saison button").forEach(b=>{b.setAttribute("aria-pressed",b.dataset.s===saison);b.onclick=()=>{saison=b.dataset.s;try{localStorage.setItem("cgr-saison",saison)}catch{}document.querySelectorAll("#saison button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.s===saison));draw();msg(saison==="hiver"?HMSG:"Chemins d'été.",saison==="hiver"?9000:3000)}});
  map.on("style.load",()=>setTimeout(draw,0));
  const startOn=/(^|&)tous(&|=|$)/.test(location.hash.slice(1))||(!track.length&&(()=>{try{return localStorage.getItem("cgr-tous")!=="0"}catch{return true}})());

  if(WANT3D){const go=()=>{try{applyRelief();map.easeTo({pitch:55,bearing:-10,duration:1200})}catch{}};if(map.isStyleLoaded())go();else map.once("load",go)}
})();
